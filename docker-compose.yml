services:
  9router:
    # Builds the Cursor-CLI-enabled image from ./Dockerfile.
    # To use the published image instead, drop `build:` and set:
    #   image: tsulatsitamim/9router:latest
    build:
      context: .
      dockerfile: Dockerfile
    image: tsulatsitamim/9router:latest
    container_name: 9router
    restart: always
    ports:
      - "20128:20128"
    volumes:
      - 9router-data:/app/data
      # Optional: persist Cursor CLI login/state across container rebuilds.
      - 9router-cursor:/home/node/.cursor
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
    depends_on:
      - headroom

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    ports:
      - "8787:8787"

volumes:
  9router-data:
    name: 9router-data
  9router-cursor:
    name: 9router-cursor
